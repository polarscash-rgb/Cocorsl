<title>Cocorsl</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--bd:#e3e2dc;--ac:#1f6f5c;--acfg:#fff;--bad:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--fg:#f0efe9;--mut:#a3a29a;--card:#212120;--bd:#363633;--ac:#4cb89c;--acfg:#0d1f1a;--bad:#f2867e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--fg:#f0efe9;--mut:#a3a29a;--card:#212120;--bd:#363633;--ac:#4cb89c;--acfg:#0d1f1a;--bad:#f2867e;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
h1{font-size:1.4rem;margin:0}h3{margin:8px 0 2px;font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card,.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.card img,.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--bd);display:block}
.pr{margin:0 0 8px;color:var(--mut)}
.sz{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--bd);background:transparent;color:var(--fg);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.chip.on{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
.chip:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.btn{background:var(--ac);color:var(--acfg);border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;width:100%}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--bd);width:auto}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;margin:4px 0 10px}
label{font-size:.85rem;color:var(--mut)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between}
.bar .btn{width:auto}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}
.msg{color:var(--bad);font-size:.9rem}.mut{color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style><style>artifact-sync,artifact-local{display:contents}</style><style>artifact-sync,artifact-local{display:contents}</style><style>artifact-sync,artifact-local{display:contents}</style></head><body><main id="app"></main>

<script>
const D=JSON.parse(document.getElementById('data').textContent);
let cart=[],sel={},view='shop',canEdit=false,art=null,assets=null,note='',sent='';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const total=()=>cart.reduce((t,c)=>t+(parseFloat(D.products[c.i]?.price)||0)*c.q,0);
function render(){
  const app=$('#app');
  const head=`<header><h1>Cocorsl</h1><div>${canEdit?`<button class="btn sec" data-act="${view==='admin'?'shop':'admin'}">${view==='admin'?'Vezi magazinul':'Administrare'}</button>`:''}</div></header>`;
  app.innerHTML=head+(view==='admin'?admin():view==='checkout'?checkout():shop())+(view==='shop'&&cart.length?`<div class="bar"><div><b>${cart.reduce((t,c)=>t+c.q,0)}</b> produse · <b>${total()} lei</b></div><button class="btn" data-act="checkout">Vezi coșul</button></div>`:'');
}
function shop(){
  if(!D.products.length)return '<p class="mut">Nu sunt produse momentan.</p>';
  return '<div class="grid">'+D.products.map((p,i)=>{const any=p.sizes.some(s=>s.in);
    return `<article class="card">${p.img?`<img src="${p.img}" alt="">`:'<div class="ph"></div>'}<h3>${esc(p.name)}</h3><p class="pr">${esc(p.price)} lei</p><div class="sz">${p.sizes.map(s=>`<button class="chip ${sel[i]===s.n?'on':''}" ${s.in?'':'disabled'} data-act="size" data-i="${i}" data-s="${esc(s.n)}">${esc(s.n)}</button>`).join('')}</div><button class="btn" data-act="add" data-i="${i}" ${any?'':'disabled'}>${any?'Adaugă în coș':'Stoc epuizat'}</button></article>`}).join('')+'</div><p class="msg" id="m">'+esc(note)+'</p>';
}
function checkout(){
  if(sent)return `<div class="box"><h3>Comanda e pregătită</h3><p>Dacă WhatsApp nu s-a deschis, copiază mesajul și trimite-l manual.</p><textarea rows="9" readonly>${esc(sent)}</textarea><button class="btn sec" data-act="shop">Înapoi la magazin</button></div>`;
  return `<div class="box"><h3>Coșul tău</h3>${cart.map((c,k)=>`<div class="row"><span>${esc(D.products[c.i].name)} · ${esc(c.s)} × ${c.q}</span><button class="btn sec" data-act="rm" data-k="${k}">Șterge</button></div>`).join('')||'<p class="mut">Coșul e gol.</p>'}<p><b>Total: ${total()} lei</b></p>
  <h3>Datele de livrare</h3>
  <label>Nume</label><input id="f_n" autocomplete="name">
  <label>Nr. de telefon</label><input id="f_t" type="tel" autocomplete="tel">
  <label>Email</label><input id="f_e" type="email" autocomplete="email">
  <div class="two"><div><label>Județ</label><input id="f_j" autocomplete="address-level1"></div><div><label>Oraș</label><input id="f_l" autocomplete="address-level2"></div></div>
  <div class="two"><div><label>Strada</label><input id="f_s" autocomplete="address-line1"></div><div><label>Numărul</label><input id="f_nr"></div></div>
  <label>Bloc, scara, etaj, apartament (dacă e cazul)</label><input id="f_b" autocomplete="address-line2">
  <label>Cod poștal</label><input id="f_c" inputmode="numeric" autocomplete="postal-code">
  <p class="msg" id="m">${esc(note)}</p>
  <button class="btn" data-act="finish" ${cart.length?'':'disabled'}>Finalizează comanda</button><br><br><button class="btn sec" data-act="shop">Înapoi</button></div>`;
}
function admin(){
  return `<div class="box"><label>Numărul tău de WhatsApp (format internațional, fără +, ex: 40712345678)</label><input data-f="wa" value="${esc(D.wa)}"></div><br>`+
  D.products.map((p,i)=>`<div class="box" style="margin-bottom:12px"><div class="two"><div><label>Denumire</label><input data-f="name" data-i="${i}" value="${esc(p.name)}"></div><div><label>Preț (lei)</label><input data-f="price" data-i="${i}" value="${esc(p.price)}"></div></div>
  <label>Mărimi europene, separate prin virgulă (ex: 38, 39, 40, 41)</label><input data-f="sizes" data-i="${i}" value="${esc(p.sizes.map(s=>s.n).join(', '))}">
  <div class="sz">${p.sizes.map((s,j)=>`<label class="chip"><input type="checkbox" style="width:auto;margin:0 6px 0 0" data-f="stock" data-i="${i}" data-j="${j}" ${s.in?'checked':''}>${esc(s.n)} pe stoc</label>`).join('')}</div>
  ${p.img?`<img src="${p.img}" alt="" style="width:90px;border-radius:8px"><br>`:''}<label>Imagine</label><input type="file" accept="image/*" data-f="img" data-i="${i}">
  <button class="btn sec" data-act="del" data-i="${i}">Șterge produsul</button></div>`).join('')+
  `<button class="btn sec" data-act="new">+ Produs nou</button> <button class="btn" style="width:auto" data-act="save">Descarcă fișierul actualizat</button><p class="msg" id="m">${esc(note)}</p>`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,i=+b.dataset.i;note='';
  if(a==='size'){sel[i]=b.dataset.s}
  else if(a==='add'){if(!sel[i]){note='Alege mai întâi mărimea.'}else{const f=cart.find(c=>c.i===i&&c.s===sel[i]);f?f.q++:cart.push({i,s:sel[i],q:1});sel[i]=null}}
  else if(a==='rm'){cart.splice(+b.dataset.k,1)}
  else if(a==='checkout'||a==='shop'||a==='admin'){view=a;sent=''}
  else if(a==='finish'){return finish()}
  else if(a==='new'){D.products.push({name:'Produs nou',price:'0',img:'',sizes:[{n:'40',in:true}]})}
  else if(a==='del'){D.products.splice(i,1);cart=[]}
  else if(a==='save'){return save()}
  render();
});
document.addEventListener('change',async e=>{
  const t=e.target,f=t.dataset.f;if(!f)return;const i=+t.dataset.i,p=D.products[i];
  if(f==='wa')D.wa=t.value.replace(/\D/g,'');
  else if(f==='name')p.name=t.value;
  else if(f==='price')p.price=t.value.replace(',','.');
  else if(f==='sizes'){const old=Object.fromEntries(p.sizes.map(s=>[s.n,s.in]));p.sizes=t.value.split(',').map(x=>x.trim()).filter(Boolean).map(n=>({n,in:old[n]??true}));render()}
  else if(f==='stock')p.sizes[+t.dataset.j].in=t.checked;
  else if(f==='img'&&t.files[0]){try{p.img=await shrink(t.files[0]);render()}catch(x){note='Imaginea nu s-a încărcat.';render()}}
});
function shrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.82))};im.onerror=no;im.src=u})}
function finish(){
  const v=id=>$(id).value.trim(),n=v('#f_n'),t=v('#f_t'),em=v('#f_e'),j=v('#f_j'),l=v('#f_l'),s=v('#f_s'),nr=v('#f_nr'),b=v('#f_b'),c=v('#f_c');
  if(!n||t.replace(/\D/g,'').length<9||!/^\S+@\S+\.\S+$/.test(em)||!j||!l||!s||!nr||c.replace(/\D/g,'').length!==6){note='Completează toate câmpurile: numele, telefonul, un email valid, județul, orașul, strada, numărul și codul poștal (6 cifre). Doar blocul/scara/etajul pot rămâne goale.';return render()}
  const lines=cart.map(c=>`- ${D.products[c.i].name}, mărime ${c.s}, ${c.q} buc`);
  sent=`Comandă nouă\n${lines.join('\n')}\nTotal: ${total()} lei\n\nNume: ${n}\nNr. de telefon: ${t}\nEmail: ${em}\nJudeț: ${j}\nOraș: ${l}\nStrada: ${s}\nNumărul: ${nr}\nBloc/scara/etaj: ${b||'-'}\nCod poștal: ${c}`;
  if(D.wa)window.open('https://wa.me/'+D.wa+'?text='+encodeURIComponent(sent),'_blank');
  cart=[];render();
}
function save(){
  const app=$('#app'),keep=app.innerHTML;app.innerHTML='';
  $('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
  const html='<!doctype html>\n'+document.documentElement.outerHTML;
  app.innerHTML=keep;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='index.html';a.click();
  note='Fișierul index.html a fost descărcat. Încarcă-l pe site ca să apară modificările.';render()
}
function chk(){canEdit=location.hash==='#admin';if(!canEdit&&view==='admin')view='shop';render()}
addEventListener('hashchange',chk);chk();
